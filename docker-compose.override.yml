version: '3.8'

services:
  backend:
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      DEBUG: "True"
    stdin_open: true
    tty: true

  frontend:
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    stdin_open: true
    tty: true

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"