version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: regionshop-db
    environment:
      POSTGRES_DB: regionshop
      POSTGRES_USER: regionshop_user
      POSTGRES_PASSWORD: regionshop_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regionshop_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: regionshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regionshop-backend
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
      "
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://regionshop_user:regionshop_password@db:5432/regionshop
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regionshop-celery
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    environment:
      DATABASE_URL: postgres://regionshop_user:regionshop_password@db:5432/regionshop
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regionshop-celery-beat
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
      - celery
    environment:
      DATABASE_URL: postgres://regionshop_user:regionshop_password@db:5432/regionshop
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: regionshop-frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: